services:

  frontend:
    image: ${DOCKER_USERNAME}/github-search-frontend:${VERSION}
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    image: ${DOCKER_USERNAME}/github-search-backend:${VERSION}
    build:
      context: ./backend
    ports:
      - "8082:8082"