name: github-search-app pipeline

on:
  push:
    branches:
      - main

jobs:

  # =========================
  # SECURITY
  # =========================

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SAST
      - name: Semgrep
        uses: semgrep/semgrep@v1
        with:
          args: --config auto

      # Secret scanning
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dependency + filesystem vulnerability scan
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1


  # =========================
  # FRONTEND
  # =========================

  frontend:
    needs: security

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build


  # =========================
  # BACKEND
  # =========================

  backend:
    needs: security

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Backend
        working-directory: backend
        run: go build ./...


  # =========================
  # DOCKER
  # =========================

  docker:
    needs:
      - frontend
      - backend

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "VERSION=v${{ github.run_number }}" >> $GITHUB_ENV
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> $GITHUB_ENV

      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | \
          docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Build Docker Images
        run: docker compose build

      # Container security
      - name: Scan Docker Images
        run: |
          docker images

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/github-search-backend:${{ env.VERSION }}
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Push Docker Images
        run: docker compose push